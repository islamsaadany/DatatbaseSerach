<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Search</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a2233;
      --muted: #6b7688;
      --accent: #3b6ef6;
      --border: #e3e8f0;
      --shadow: 0 8px 30px rgba(20, 40, 90, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 0.95rem;
    }
    .search-box {
      position: relative;
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 110, 246, 0.15);
    }
    .search-box svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b6ef6, #7aa2ff);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .info .name {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .info .phone {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }
    .call-btn {
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Team Search</h1>
    <p class="subtitle">Search team members by name or phone number.</p>

    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search" placeholder="Search by name or phone..." autocomplete="off" />
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    // Team members data
    const team = [
      { name: "Alice Johnson", phone: "+1 555 123 4567" },
      { name: "Bob Smith", phone: "+1 555 987 6543" }
    ];

    const searchInput = document.getElementById("search");
    const resultsEl = document.getElementById("results");

    function initials(name) {
      return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
    }

    function render(list) {
      if (list.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No team members found.</div>';
        return;
      }
      resultsEl.innerHTML = list.map(m => `
        <div class="card">
          <div class="avatar">${initials(m.name)}</div>
          <div class="info">
            <div class="name">${m.name}</div>
            <div class="phone">${m.phone}</div>
          </div>
          <a class="call-btn" href="tel:${m.phone.replace(/\s+/g, "")}">Call</a>
        </div>
      `).join("");
    }

    function search(query) {
      const q = query.trim().toLowerCase();
      if (!q) return render(team);
      const filtered = team.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.phone.replace(/\s+/g, "").includes(q.replace(/\s+/g, ""))
      );
      render(filtered);
    }

    searchInput.addEventListener("input", e => search(e.target.value));
    render(team);
  </script>
</body>
</html>
