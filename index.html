<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Search</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a2233;
      --muted: #6b7688;
      --accent: #3b6ef6;
      --danger: #e5484d;
      --border: #e3e8f0;
      --shadow: 0 8px 30px rgba(20, 40, 90, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 0.95rem;
    }
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 110, 246, 0.15);
    }
    .search-box svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    /* Add member form */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .add-form input {
      flex: 1 1 140px;
      min-width: 0;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .add-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 110, 246, 0.15);
    }
    .add-btn {
      flex: 0 0 auto;
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .add-btn:hover { opacity: 0.9; }
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b6ef6, #7aa2ff);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .info .name {
      font-weight: 600;
      font-size: 1.05rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .info .phone {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }
    .actions { display: flex; gap: 8px; align-items: center; }
    .call-btn {
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .delete-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--danger);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .delete-btn:hover {
      background: rgba(229, 72, 77, 0.08);
      border-color: var(--danger);
    }
    .delete-btn svg { width: 16px; height: 16px; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Team Search</h1>
    <p class="subtitle">Search team members by name or phone number.</p>

    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search" placeholder="Search by name or phone..." autocomplete="off" />
    </div>

    <form class="add-form" id="add-form">
      <input type="text" id="new-name" placeholder="Name" autocomplete="off" required />
      <input type="tel" id="new-phone" placeholder="Phone" autocomplete="off" required />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="results" id="results"></div>
  </div>

  <script>
    // Default sample data
    const defaultTeam = [
      { name: "Alice Johnson", phone: "+1 555 123 4567" },
      { name: "Bob Smith", phone: "+1 555 987 6543" }
    ];

    const STORAGE_KEY = "teamSearchMembers";

    // Load from localStorage, falling back to the sample data.
    let team;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      team = Array.isArray(saved) ? saved : defaultTeam.slice();
    } catch (e) {
      team = defaultTeam.slice();
    }

    const searchInput = document.getElementById("search");
    const resultsEl = document.getElementById("results");
    const addForm = document.getElementById("add-form");
    const nameInput = document.getElementById("new-name");
    const phoneInput = document.getElementById("new-phone");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(team));
    }

    function initials(name) {
      return name.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function render(list) {
      if (list.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No team members found.</div>';
        return;
      }
      resultsEl.innerHTML = list.map(m => {
        const idx = team.indexOf(m);
        return `
        <div class="card">
          <div class="avatar">${escapeHtml(initials(m.name))}</div>
          <div class="info">
            <div class="name">${escapeHtml(m.name)}</div>
            <div class="phone">${escapeHtml(m.phone)}</div>
          </div>
          <div class="actions">
            <a class="call-btn" href="tel:${escapeHtml(m.phone.replace(/\s+/g, ""))}">Call</a>
            <button class="delete-btn" data-index="${idx}" title="Delete" aria-label="Delete ${escapeHtml(m.name)}">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
          </div>
        </div>`;
      }).join("");
    }

    function currentFilter() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return team;
      return team.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.phone.replace(/\s+/g, "").includes(q.replace(/\s+/g, ""))
      );
    }

    function refresh() {
      render(currentFilter());
    }

    // Search
    searchInput.addEventListener("input", refresh);

    // Add member
    addForm.addEventListener("submit", e => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      if (!name || !phone) return;
      team.push({ name, phone });
      save();
      addForm.reset();
      nameInput.focus();
      refresh();
    });

    // Delete member (event delegation)
    resultsEl.addEventListener("click", e => {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;
      const idx = parseInt(btn.dataset.index, 10);
      const member = team[idx];
      if (!member) return;
      if (confirm(`Delete ${member.name}?`)) {
        team.splice(idx, 1);
        save();
        refresh();
      }
    });

    refresh();
  </script>
</body>
</html>
